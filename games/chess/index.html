<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Шахматы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

    <header class="header">
        <div class="logo" id="title">Шахматы</div>
        <div class="controls-wrapper">
            <button class="burger-toggle" id="burgerToggle" title="Меню настроек">⋮</button>
            <div class="controls-menu" id="controlsMenu">
                <div class="color-picker" id="colorPicker">
                    <span class="color-dot theme-green" data-color="green"></span>
                    <span class="color-dot theme-blue" data-color="blue"></span>
                    <span class="color-dot theme-purple" data-color="purple"></span>
                    <span class="color-dot theme-orange" data-color="orange"></span>
                </div>
                <button id="langBtn" title="Язык">🌍</button>
                <button id="themeBtn" title="Тема">🌗</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="game-container">
            <div class="mode-switcher">
                <button class="mode-btn active" data-mode="bot" id="modeBot">🤖 С ботом</button>
                <button class="mode-btn" data-mode="two" id="modeTwo">👥 На двоих</button>
            </div>
            <div class="chess-board" id="chessBoard"></div>
            <div class="game-info">
                <div class="turn-indicator">
                    <span id="turnText">Ход белых</span>
                    <span class="piece" id="turnPiece">♔</span>
                </div>
                <div class="game-status" id="gameStatus">Игра продолжается</div>
                <button class="btn-reset" id="resetBtn">↻ Новая игра</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
