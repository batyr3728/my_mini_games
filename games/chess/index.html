<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <header>
        <button class="back-btn" id="back-btn">⬅️</button>
        <h1 class="title">Шахматы</h1>
        <div class="icons">
            <button class="icon-btn" id="langBtn" aria-label="Сменить язык">🌍</button>
            <button class="icon-btn" id="themeBtn" aria-label="Сменить тему">🌓</button>
        </div>
    </header>

    <main>
        <!-- Игровое поле -->
        <div class="game-container">
            <div class="board" id="chessBoard"></div>
        </div>

        <!-- Информация между полем и кнопкой -->
        <div class="info-bar">
            <div class="score-box mode-box">
                <div class="label" id="modeLabel">РЕЖИМ</div>
                <div class="mode-switcher-text" id="modeSwitcher">
                    <span class="mode-option active" data-mode="bot" id="modeBotText">С ботом</span>
                    <span class="mode-divider">|</span>
                    <span class="mode-option" data-mode="two" id="modeTwoText">На двоих</span>
                </div>
            </div>
            <div class="score-box turn-box">
                <div class="label" id="turnLabel">ХОД</div>
                <div class="value" id="turnDisplay">Белые</div>
            </div>
        </div>

        <!-- Кнопка внизу -->
        <button class="reset-btn" id="reset-btn">Новая игра</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
